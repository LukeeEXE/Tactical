# HUD layout in GUI pixels. (pack) = baked into the resource pack: run /game pack rebuild after changing it.
# Everything else applies after /game reload hud. Preview: /game match test quickplay none 4 (you + 4 virtual players).
# "Rows" count pixels down from the top of a text line: a player head covers rows 0-7, Pinch capitals rows 2-6.
# The first boss bar line starts 3 px below the top of the screen; the game draws inline heads on rows -1..6, so
# the strip and boxes start at row -2 (1 px from the edge) to keep the heads centred in the strip.
schema-version: 5
bossbar:
  font: pinch            # a TTF font from resourcepack/fonts/ used for the boss bar text and scores
  text-offset-y: -1      # move the time down (+) or up (-) in pixels (-1 = centred in its box)
  tile-ascent: 9         # (pack) team strip (10 px tall): 9 = rows -2..7, 1 px around the heads (drawn on rows -1..6)
  panel-ascent: 9        # (pack) legacy 13 px panel (unused by the default layout)
  score-ascent: 9        # (pack) score and timer boxes (10 px): 9 = rows -2..7, like the strip
  time-row: 8            # (pack) row of the 1 px timer and health lines, right under the bar
  head-advance: 8        # width the client gives an inline player head (fixed by the game: 8)
  head-slot: 10          # horizontal space per player on the team strip (head 8 px + 2 px gap)
  strip-padding: 2       # strip background left/right of the first/last head
  section-gap: 2         # pixels between the strip, the score box and the timer
  panel-padding: 3       # pixels of timer box left/right of the time (the colon stays on the screen centre)
  score-offset-y: -1     # move the score down (+) / up (-) (-1 = centred in its box)
  timer-width: 0         # fixed timer box width; 0 = wide enough for "00:00"
  row-spacing: 19        # distance between two boss bars (vanilla: 19); the time sits on the boss bar below
                         # the heads (drawn on top of the box) and is moved up by this much
actionbar:
  panel-ascent: 19       # (pack) two-line hint box (22 px): 19 = rows -12..9, 4 px around the text, clear of item names
  hint-width: 160        # fixed width of the hint box in px (wider only if a text does not fit); 0 = fit the text
  line1-offset-y: -10     # first hint line (orange), Pinch shift in pixels
  line2-offset-y: -1      # second hint line (white)
money:
  enabled: true
  offset-y: 33           # (pack) pixels from the action-bar line down to the hunger-bar row
  text-offset-y: 32      # Pinch shift of the amount
  left: 45               # pixels right of the screen centre where the money panel starts (ends with the hunger bar)
