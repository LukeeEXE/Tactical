# Kit "Sentinel". PLACEHOLDER CONTENT: replace the base kit and shop with the real design.
# base-kit: given at the start of EVERY round (not purchases, never lost). slot: 0-8 hotbar, 9-35 inventory,
#           helmet/chestplate/leggings/boots/offhand, or auto. Each entry: material (vanilla) or item (items/*.yml).
# shop:     this kit's own shop, the same on every map. Three categories with fixed places in the shop screen:
#           melee (up to 5), utility (up to 3), ranged (up to 5). Entries: name, price, max (how many a player may
#           carry), and give: { material | item, amount } or enchant: { enchantment, level, applies-to }.
schema-version: 2
id: sentinel
name: "Sentinel"
description: "Holds sites and angles."
enabled: true
# Placeholder icon item; the GUI item also carries custom_model_data "tactical:kit/sentinel" for a resource-pack logo.
icon:
  material: shield
base-kit:
  - { slot: 0, material: wooden_sword }
  - { slot: 1, material: wooden_pickaxe }
  - { slot: 2, item: slowness_shot }
shop:
  melee:
    stone_sword: { name: "Stone Sword", price: 300, max: 1, give: { material: stone_sword } }
    iron_sword: { name: "Iron Sword", price: 750, max: 1, give: { material: iron_sword } }
    stone_axe: { name: "Stone Axe", price: 400, max: 1, give: { material: stone_axe } }
    iron_axe: { name: "Iron Axe", price: 900, max: 1, give: { material: iron_axe } }
    sharpness: { name: "Sharpness I", price: 800, max: 1, enchant: { enchantment: sharpness, level: 1, applies-to: [wooden_sword, stone_sword, iron_sword, stone_axe, iron_axe] } }
  utility:
    speed_shot: { name: "Shot of Speed", price: 200, max: 2, give: { item: speed_shot } }
    slowness_shot: { name: "Shot of Slowness", price: 250, max: 2, give: { item: slowness_shot } }
    heal_shot: { name: "Shot of Healing", price: 300, max: 1, give: { item: heal_shot } }
  ranged:
    bow: { name: "Bow", price: 500, max: 1, give: { material: bow } }
    crossbow: { name: "Crossbow", price: 700, max: 1, give: { material: crossbow } }
    arrows: { name: "Arrows x8", price: 100, max: 3, give: { material: arrow, amount: 8 } }
    power: { name: "Power I", price: 600, max: 1, enchant: { enchantment: power, level: 1, applies-to: [bow] } }
