# Fast mode for administrators' isolated test matches (never ranked: no stats, XP, leaderboards).
schema-version: 2
id: test
display-name: "<gray>Test"
team-size: 5
rounds-to-win: 5
halftime-after-round: 4
sudden-death-at: 4
sudden-death-sides: random
skip-vote: any
ranked: false
timers:
  kit-select: 3
  buy-phase: 2
  round: 5
  bomb: 4
  plant: 1
  defuse: 2
  defuse-checkpoint: 1
  round-end: 1
  halftime: 3
  sudden-death-kit-select: 2
  postgame: 2
bomb:
  # Defuse range around the planted bomb; the particle ring shows exactly this radius.
  defuse-radius: 3.5
  # How close an attacker must walk to a dropped bomb to pick it up.
  pickup-radius: 1.5
  # Whether taking damage interrupts a defuse.
  interrupt-defuse-on-damage: false
  # Players within this radius die when the bomb explodes (0 = no damage).
  detonation-kill-radius: 0
