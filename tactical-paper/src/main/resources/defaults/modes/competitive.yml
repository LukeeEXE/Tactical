# Game mode rules. Durations are in SECONDS (decimals allowed).
# Changes apply to matches created AFTER '/game reload modes'; running matches keep their snapshot.
schema-version: 1
id: competitive
display-name: "<gold>Competitive"
team-size: 5
# First team to this many round wins takes the match.
rounds-to-win: 9
# Teams switch attack/defence after this round.
halftime-after-round: 8
# At this score for BOTH teams, one sudden-death round decides the match.
sudden-death-at: 8
# Sides in sudden death: keep | swap | random
sudden-death-sides: random
# How a team agrees to skip halftime / sudden-death kit select: majority | all | any
skip-vote: majority
# Whether results count for stats, XP and leaderboards.
ranked: true
timers:
  kit-select: 30
  buy-phase: 30
  round: 100
  bomb: 45
  plant: 5
  defuse: 10
  defuse-checkpoint: 5
  round-end: 5
  halftime: 60
  sudden-death-kit-select: 20
  postgame: 15
bomb:
  # Defuse range around the planted bomb; the particle ring shows exactly this radius.
  defuse-radius: 3.5
  # How close an attacker must walk to a dropped bomb to pick it up.
  pickup-radius: 1.5
  # Whether taking damage interrupts a defuse.
  interrupt-defuse-on-damage: false
  # Players within this radius die when the bomb explodes (0 = no damage).
  detonation-kill-radius: 0
