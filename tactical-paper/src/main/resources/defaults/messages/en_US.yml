# Player-facing text in MiniMessage format (https://docs.advntr.dev/minimessage/format.html).
# Placeholders look like <name>. Missing keys fall back to the built-in English text.
schema-version: 1
prefix: "<dark_gray>[<red>Tactical</red>]</dark_gray> "
no-permission: "<red>You do not have permission to do that."
match.created: "<green>Created <match> (<mode>) with <players> participants."
match.kit-select: "<yellow>Kit selection (<phase>) — <seconds>s."
match.kit-locked: "<gray><player> locked <white><kit></white>."
match.round-start: "<gold>Round <round><sudden> — buy phase."
match.round-live: "<red>Round <round> is LIVE."
match.round-won: "<team> <gray>win round <round> (<reason>).</gray> <score_a> <dark_gray>-</dark_gray> <score_b>"
match.halftime: "<yellow>Halftime! Teams switch sides. Pick your second-half kit."
match.sudden-death: "<dark_red><bold>SUDDEN DEATH</bold></dark_red> <gray>— choose your first- or second-half kit."
match.end: "<gold>Match over — <winner>. <white><score_a> - <score_b>"
match.aborted: "<red>Match ended: <reason>."
match.paused: "<yellow>Match paused by <by>.<reason>"
match.resume-countdown: "<yellow>Resuming in <seconds>s..."
match.resumed: "<green>Match resumed."
# --- Match chat (shown as "[icon] text"; players are rendered as <shield> <head> Name in their team colour) ---
chat.kit-select: "<gold>Choose your kit for the <phase>!</gold> <gray><seconds>s"
chat.kit-locked: "<player> <gray>locked</gray> <white><kit></white><gray>.</gray>"
chat.round-start: "<aqua>Round <round> started!</aqua> <gray>You are</gray> <role><gray>.</gray>"
chat.round-start-sudden-death: "<dark_red>Sudden death!</dark_red> <gray>You are</gray> <role><gray>.</gray>"
chat.round-live: "<yellow>Round <round> is live!</yellow>"
chat.kill: "<victim> <gray>was slain by</gray> <killer><gray>.</gray>"
chat.died: "<victim> <gray>was eliminated.</gray>"
chat.bomb-planted: "<player> <red>planted the bomb at <white><site></white>!</red>"
chat.bomb-defused: "<player> <aqua>defused the bomb!</aqua>"
chat.bomb-exploded: "<red>The bomb exploded!</red>"
chat.round-won: "<team> <white>won round <round>!</white> <score_a> <dark_gray>-</dark_gray> <score_b>"
chat.round-lost: "<team> <red>won round <round>.</red> <score_a> <dark_gray>-</dark_gray> <score_b>"
chat.halftime: "<gold>Halftime! Teams switch sides.</gold>"
chat.sudden-death: "<dark_red>Sudden death!</dark_red> <gray>Pick your first- or second-half kit.</gray>"
chat.match-aborted: "<red>Match ended: <reason>.</red>"
chat.paused: "<yellow>The match was paused<reason>.</yellow>"
chat.resume-countdown: "<yellow>Resuming in <seconds>s...</yellow>"
chat.resumed: "<green>The match resumed.</green>"
chat.disconnected: "<player> <gray>disconnected.</gray>"
chat.reconnected: "<player> <gray>reconnected.</gray>"
