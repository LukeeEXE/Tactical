name: Tactical
version: '${version}'
main: dev.tactical.paper.TacticalPlugin
api-version: '26.3'
description: Round-based 5v5 tactical shooter.
load: POSTWORLD
# Later phases add: depend: [packetevents]; softdepend: [voicechat, LuckPerms]
permissions:
  tactical.admin:
    description: Full administrator access.
    default: op
    children:
      tactical.admin.match: true
      tactical.admin.reload: true
      tactical.admin.logs: true
      tactical.admin.debug: true
      tactical.admin.maps: true
      tactical.admin.pools: true
      tactical.admin.pack: true
      tactical.admin.lobby: true
      tactical.admin.items: true
      tactical.bypass.hunger: true
  tactical.admin.maps:
    description: Create, edit, validate and publish maps.
    default: op
  tactical.admin.pools:
    description: Manage map pools.
    default: op
  tactical.admin.pack:
    description: Rebuild the resource pack and use the custom block palette.
    default: op
  tactical.admin.items:
    description: List custom items and give them to yourself (/game item).
    default: op
  tactical.admin.lobby:
    description: Set the lobby spawn.
    default: op
  tactical.bypass.hunger:
    description: In creative mode, keep the normal hunger bar (builders).
    default: op
  tactical.admin.match:
    description: Create/end/pause/resume matches and force round results.
    default: op
  tactical.admin.reload:
    description: Reload configuration files.
    default: op
  tactical.admin.logs:
    description: View match recordings and errors.
    default: op
  tactical.admin.debug:
    description: Debug tools (simulate eliminations, plants, defuses in test matches).
    default: op
