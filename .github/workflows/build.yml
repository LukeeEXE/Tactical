# Builds the plugin on every push to main and publishes the jar as the "dev-latest" pre-release.
# Download link (always the newest build):
#   https://github.com/LukeeEXE/Tactical/releases/download/dev-latest/Tactical-0.1.0-SNAPSHOT.jar
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tactical-plugin
          path: tactical-paper/build/libs/Tactical-*.jar

      # Replaces the previous "dev-latest" pre-release so the download link above always points at the newest build.
      - name: Publish dev-latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete dev-latest --yes --cleanup-tag || true
          gh release create dev-latest tactical-paper/build/libs/Tactical-*.jar \
            --target "${{ github.sha }}" --prerelease \
            --title "Latest development build" \
            --notes "Automatic build of commit ${{ github.sha }}. Install: put the jar in the plugins/ folder of a Paper 26.3 server (Java 25). See docs/BUILDING.md."
